<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حراج اليمن برو - Haraj Yemen Pro</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
        header { background-color: var(--card-bg); padding: 15px; text-align: center; border-bottom: 1px solid var(--border-color); sticky: top; top: 0; z-index: 100; }
        header h1 { color: var(--accent-color); font-size: 1.5rem; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background-color: var(--card-bg); border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .card h3 { color: var(--accent-color); margin-bottom: 8px; }
        .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 5px; }
        .price { color: #4caf50; font-weight: bold; font-size: 1.1rem; }
        .btn { background-color: var(--accent-color); color: #000; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--card-bg); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--border-color); }
        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; text-align: center; }
        .nav-item.active { color: var(--accent-color); font-weight: bold; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #2a2a2a; color: #fff; }
    </style>
</head>
<body>

<header>
    <h1>🇾🇪 حراج اليمن برو</h1>
</header>

<div class="container" id="app-content">
    <div class="card">
        <h3>مرحباً بك في حراج اليمن برو</h3>
        <p>المنصة الرائدة للإعلانات المباشرة والمتاجر الموثوقة.</p>
    </div>

    <h2 style="margin: 15px 0 10px 0; font-size: 1.1rem;">أحدث الإعلانات</h2>
    <div id="ads-list">
        <div class="card">
            <h3>تويوتا كامري 2020 مجدد</h3>
            <p>الموقع: صنعاء - حالة ممتازة</p>
            <p class="price">12,000 $</p>
            <button class="btn" onclick="alert('تواصل عبر الواتساب: 770000000')">تواصل مع البائع</button>
        </div>
    </div>
</div>

<nav class="nav-bar">
    <a href="#" class="nav-item active">الرئيسية</a>
    <a href="#" class="nav-item" onclick="showAddAd()">أضف إعلان</a>
    <a href="#" class="nav-item" onclick="alert('قسم المتاجر الموثوقة قريباً')">المتاجر</a>
</nav>

<script>
    function showAddAd() {
        document.getElementById('app-content').innerHTML = `
            <div class="card">
                <h3>إضافة إعلان جديد</h3>
                <form onsubmit="submitAd(event)">
                    <div class="form-group"><label>عنوان الإعلان</label><input type="text" id="title" required></div>
                    <div class="form-group"><label>السعر ($)</label><input type="number" id="price" required></div>
                    <div class="form-group"><label>رقم التواصل</label><input type="text" id="phone" required></div>
                    <div class="form-group"><label>التفاصيل</label><textarea id="details" required></textarea></div>
                    <button type="submit" class="btn">نشر الآن</button>
                </form>
            </div>
        `;
    }

    function submitAd(e) {
        e.preventDefault();
        alert('تم نشر الإعلان بنجاح!');
        location.reload();
    }
</script>
</body>
</html>
